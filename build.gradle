plugins {
    alias(libs.plugins.spring.boot) apply false
}

allprojects {
    group = 'com.rootcause'
    version = '0.0.1-SNAPSHOT'
}

tasks.register('integrationTest') {
    group = 'verification'
    description = 'Runs Testcontainers integration tests across all subprojects'
    dependsOn subprojects.collect { it.tasks.matching { t -> t.name == 'integrationTest' } }
}
