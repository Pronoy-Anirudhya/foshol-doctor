spring.datasource.url=jdbc:postgresql://localhost:5434/foshol
spring.datasource.username=foshol
spring.datasource.password=${FOSHOL_DB_PASSWORD}
foshol.datasource.read-only.url=jdbc:postgresql://localhost:5434/foshol
spring.flyway.locations=classpath:db/migration,classpath:db/seed
foshol.auth.otp.dev-code=123456
foshol.storage.endpoint=http://127.0.0.1:9000
# V103 adds wheat/corn diseases for wambugu71 label map (local/demo scaffolding only).
foshol.knowledge.expected-disease-count=20
foshol.ai.mode=live
# Live GPU/HF inference is slower than fixture replay; raise local budgets.
foshol.ai.timeout=PT120S
foshol.analysis.deadline=PT180S
resilience4j.timelimiter.instances.sidecar.timeout-duration=120s
logging.level.com.rootcause.foshol=DEBUG
logging.file.name=${FOSHOL_LOG_FILE:${user.dir}/../tools/.run/app.log}

