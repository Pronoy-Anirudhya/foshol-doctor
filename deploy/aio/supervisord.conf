; Four processes in one container. Start order is by priority (postgres -> minio ->
; sidecar -> app); shutdown is the reverse, so the JVM closes its pool before Postgres
; stops. Programs inherit supervisord's environment, which entrypoint.sh has already
; populated with the resolved and persisted secrets.
[supervisord]
nodaemon=true
user=root
identifier=foshol
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; ---------------------------------------------------------------- postgres
[program:postgres]
command=/usr/local/bin/start-postgres.sh
user=postgres
directory=/var/lib/postgresql
priority=10
autostart=true
autorestart=true
startsecs=5
startretries=5
; SIGINT is fast shutdown. SIGTERM is "smart" shutdown and would block on the app's
; open connection pool until it disconnects.
stopsignal=INT
stopwaitsecs=40
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; ------------------------------------------------------------------- minio
[program:minio]
command=/usr/local/bin/start-minio.sh
user=foshol
priority=20
autostart=true
autorestart=true
startsecs=5
startretries=5
stopsignal=TERM
stopwaitsecs=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; ----------------------------------------------------------------- sidecar
[program:sidecar]
command=/usr/local/bin/start-sidecar.sh
user=foshol
directory=/app
priority=30
autostart=true
autorestart=true
startsecs=15
startretries=3
stopsignal=TERM
stopwaitsecs=30
; The ASR path forks ffmpeg; stop and kill the whole group so nothing is orphaned.
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; --------------------------------------------------------------------- app
[program:app]
command=/usr/local/bin/start-app.sh
user=foshol
directory=/opt/foshol
priority=40
autostart=true
autorestart=true
startsecs=20
startretries=5
stopsignal=TERM
stopwaitsecs=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; ------------------------------------------------ fail fast, do not limp
[eventlistener:fatalexit]
command=/opt/supervisor-venv/bin/python /usr/local/bin/fatal_exit.py
events=PROCESS_STATE_FATAL
autostart=true
autorestart=true
stderr_logfile=/dev/stdout
stderr_logfile_maxbytes=0
