plugins {
    id 'foshol.spring-conventions'
}

def catalogs = extensions.getByType(org.gradle.api.artifacts.VersionCatalogsExtension)
def libs = catalogs.named('libs')

dependencies {
    api project(':common')
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.modulith:spring-modulith-starter-core'
    implementation 'org.springframework.modulith:spring-modulith-events-api'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.modulith:spring-modulith-starter-test'
    testImplementation libs.findLibrary('testcontainers-junit').get()
    testImplementation libs.findLibrary('testcontainers-postgresql').get()
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
