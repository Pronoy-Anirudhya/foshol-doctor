[versions]
spring-boot = "4.1.1"
spring-modulith = "2.1.1"
archunit = "1.3.0"
testcontainers = "1.20.6"
uuid-creator = "6.1.1"
pgvector = "0.1.6"
java-jwt = "4.5.0"
resilience4j = "2.3.0"
springdoc = "2.8.6"
slf4j = "2.0.17"
minio = "8.5.17"

[libraries]
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-modulith-bom = { module = "org.springframework.modulith:spring-modulith-bom", version.ref = "spring-modulith" }
uuid-creator = { module = "com.github.f4b6a3:uuid-creator", version.ref = "uuid-creator" }
pgvector = { module = "com.pgvector:pgvector", version.ref = "pgvector" }
java-jwt = { module = "com.auth0:java-jwt", version.ref = "java-jwt" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
testcontainers-junit = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainers" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql", version.ref = "testcontainers" }
resilience4j-spring-boot3 = { module = "io.github.resilience4j:resilience4j-spring-boot3", version.ref = "resilience4j" }
springdoc-openapi = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
minio = { module = "io.minio:minio", version.ref = "minio" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
