intake.quality.blurry=ছবি ঝাপসা। অনুগ্রহ করে স্পষ্ট করে আবার তুলুন।
intake.quality.tooDark=ছবি খুব অন্ধকার। আলোতে রেখে আবার তুলুন।
intake.quality.tooBright=ছবি খুব উজ্জ্বল। ছায়ায় রেখে আবার তুলুন।
intake.quality.tooSmall=ছবি খুব ছোট। কাছে থেকে আবার তুলুন।
intake.quality.unreadable=ছবি পড়া যায়নি। অন্য ফাইল দিয়ে চেষ্টা করুন।
intake.quality.notACrop=ছবিতে ফসল দেখা যাচ্ছে না। অনুগ্রহ করে গাছের ছবি আবার তুলুন।
