# VM / deploy stack. Do not use this file on a laptop — that is docker-compose.yml.
# Boot: docker compose -f docker-compose.dev.yml up -d --build --wait
name: foshol-dev

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: foshol
      POSTGRES_USER: ${FOSHOL_DB_USER:-foshol}
      POSTGRES_PASSWORD: ${FOSHOL_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - foshol

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${FOSHOL_MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${FOSHOL_MINIO_SECRET_KEY}
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    # 9000 is the S3 API and must be reachable by the browser: a presigned URL is signed over
    # its Host header, so MINIO_ENDPOINT has to name this published origin (not the "minio"
    # service name) or the browser cannot resolve it at all. 9001 is only the console.
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - minio-data:/data
    networks:
      - foshol

  sidecar:
    build:
      context: ./sidecar
    restart: unless-stopped
    user: "0"
    command:
      - /bin/sh
      - -c
      - chown -R foshol:foshol /home/foshol/.cache/huggingface && exec runuser -u foshol -- uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
    environment:
      FOSHOL_AI_MODE: live
      FOSHOL_SIDECAR_VISION_BACKEND: visionary
      FOSHOL_AI_VISION_CROP_ROUTES: rice=rice,tomato=rice,potato=rice,corn=rice,wheat=rice
      FOSHOL_AI_VISION_RICE_MODEL_ID: VisionaryQuant/5_Crop_Disease_Detection
      FOSHOL_AI_VISION_RICE_MODEL_REVISION: 63080391f7d2bdb331ab356b0d1d9b4b603b3946
      FOSHOL_AI_VISION_RICE_FALLBACK_MODEL_ID: prithivMLmods/Rice-Leaf-Disease
      FOSHOL_AI_VISION_RICE_FALLBACK_MODEL_REVISION: 170d10e070c308e0e5337690d67371825591f35b
      FOSHOL_AI_VISION_SOLANACEAE_MODEL_ID: Daksh159/plant-disease-mobilenetv2
      FOSHOL_AI_VISION_SOLANACEAE_MODEL_REVISION: d3fb2afc90da83086eff06e9088a889b6c43d4a6
      FOSHOL_AI_ASR_MODEL_ID: ashrafulparan/whisper-small-bangla
      FOSHOL_AI_ASR_MODEL_REVISION: 25c88973563146654493b97882fb2806d2fdeaaa
      FOSHOL_AI_EMBED_MODEL_ID: sentence-transformers/LaBSE
      FOSHOL_AI_EMBED_MODEL_REVISION: 836121a0533e5664b21c7aacc5d22951f2b8b25b
      FOSHOL_SIDECAR_FIXTURE_DIR: /app/fixtures
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
      TRANSFORMERS_OFFLINE: ${TRANSFORMERS_OFFLINE:-0}
      FOSHOL_SIDECAR_TORCH_THREADS: ${FOSHOL_SIDECAR_TORCH_THREADS:-4}
    volumes:
      - huggingface-cache:/home/foshol/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 120
      start_period: 600s
    networks:
      - foshol

  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - "${APP_HOST_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      sidecar:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    networks:
      - foshol

networks:
  foshol:
    driver: bridge

volumes:
  postgres-data:
  minio-data:
  huggingface-cache:
